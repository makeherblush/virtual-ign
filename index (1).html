<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ignatius Phone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone" id="phone">
  <div id="home" class="layer"></div>
  <div id="app" class="layer"></div>
  <div id="lock" class="layer">
    <div class="lk-top"><div id="lt" class="lk-time">09:41</div><div id="ld" class="lk-date"></div></div>
    <div id="ln" class="lk-notifs"></div>
    <div class="lk-bottom">
      <button class="lk-btn" id="lk-torch">🔦</button>
      <div class="lk-face"><div class="fid" id="fid">🔒</div><small>Swipe up to unlock</small></div>
      <button class="lk-btn" id="lk-cam">📷</button>
    </div>
  </div>
  <div id="nc" class="layer panel"></div>
  <div id="cc" class="layer panel"></div>
  <div id="banner"></div>
  <div id="modal" class="layer"></div>
  <div id="toast"></div>
  <div class="island"></div>
  <div class="status" id="status"></div>
  <div class="edge edge-top" id="e-top"></div>
  <div class="edge edge-left" id="e-left"></div>
  <div class="edge edge-bottom" id="e-bottom"><i class="home-ind"></i></div>
  <div id="torch"></div>
  <div id="dim"></div>
</div>
<script src="js/db.js"></script>
<script src="js/core.js"></script>
<script src="js/apps-comm.js"></script>
<script src="js/apps-social.js"></script>
<script src="js/apps-economy.js"></script>
<script src="js/apps-system.js"></script>
<script src="js/main.js"></script>
</body>
</html>
